[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chicken-forecast"
version = "2.0.0"
description = "Weekly broiler chicken price forecasting for 34 Indonesian provinces using real Bank Indonesia PIHPS data"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Arif Farhan Bukhori" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1,<3.0",
    "numpy>=1.26,<3.0",
    "requests>=2.31",
    "xgboost>=2.0,<4.0",
    "scikit-learn>=1.3",
    "shap>=0.44",
    "plotly>=5.18",
    "streamlit>=1.36",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
chicken-forecast = "chicken_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/dashboard.py" = ["E402"]
